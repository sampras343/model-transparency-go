name: Conformance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize]
  schedule:
    - cron: '0 8 * * 1,4' # Mon/Thu 8 AM UTC
  workflow_dispatch:

permissions: {}

jobs:
  conformance:
    name: OMS conformance suite
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build model-signing binary
        run: make build

      - name: Build Go conformance adapter
        run: go build -o test/conformance/go-conformance ./test/conformance/

      - name: Run OMS conformance suite
        uses: ossf/model-signing-spec/conformance@main
        with:
          entrypoint: ${{ github.workspace }}/test/conformance/go-conformance
          xfail: |
            test_verify[negative/certificate-no-code-signing-eku_fail
            test_verify[negative/certificate-not-yet-valid_fail
        env:
          MODEL_SIGNING_BIN: ${{ github.workspace }}/build/model-signing
